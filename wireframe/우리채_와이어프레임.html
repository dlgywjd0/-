<title>우리채 — 와이어프레임 (설계 단계)</title>
<style>
  :root{
    --page-bg:#EDEDEA;
    --paper:#FFFFFF;
    --chrome:#E2E2DE;
    --block:#E7E7E3;
    --block-strong:#DADAD5;
    --border:#B7B7AF;
    --ink:#26261F;
    --ink-soft:#6B6B60;
    --bar:#D3D3CC;
    --note:#5C7285;
    --note-bg:#5C728514;
    --note-border:#5C728555;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --page-bg:#1B1B18; --paper:#242420; --chrome:#2C2C27;
      --block:#33332C; --block-strong:#3D3D34; --border:#55554A;
      --ink:#EDEDE6; --ink-soft:#9B9B8E; --bar:#454539;
      --note:#8FB0C9; --note-bg:#8FB0C91A; --note-border:#8FB0C955;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --page-bg:#1B1B18; --paper:#242420; --chrome:#2C2C27;
    --block:#33332C; --block-strong:#3D3D34; --border:#55554A;
    --ink:#EDEDE6; --ink-soft:#9B9B8E; --bar:#454539;
    --note:#8FB0C9; --note-bg:#8FB0C91A; --note-border:#8FB0C955;
    color-scheme: dark;
  }
  :root[data-theme="light"]{
    --page-bg:#EDEDEA; --paper:#FFFFFF; --chrome:#E2E2DE;
    --block:#E7E7E3; --block-strong:#DADAD5; --border:#B7B7AF;
    --ink:#26261F; --ink-soft:#6B6B60; --bar:#D3D3CC;
    --note:#5C7285; --note-bg:#5C728514; --note-border:#5C728555;
    color-scheme: light;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    background:var(--page-bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    line-height:1.5;
  }
  .shell{ display:flex; min-height:100vh; }

  /* ---- sidebar ---- */
  .sidebar{
    width:236px; flex:none; padding:28px 16px; border-right:1px solid var(--border);
    position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .sidebar h1{ font-size:15px; font-weight:700; margin:0 8px 4px; letter-spacing:-.01em; }
  .sidebar .sub{ font-size:12px; color:var(--ink-soft); margin:0 8px 20px; }
  .tab{
    display:flex; flex-direction:column; gap:1px; width:100%; text-align:left;
    background:none; border:none; cursor:pointer; padding:9px 8px; border-radius:8px;
    color:var(--ink); font-family:inherit;
  }
  .tab:hover{ background:var(--block); }
  .tab.active{ background:var(--block-strong); }
  .tab .name{ font-size:13.5px; font-weight:600; }
  .tab .path{ font-size:11px; color:var(--ink-soft); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }

  /* ---- main ---- */
  main{ flex:1; padding:32px 40px 80px; min-width:0; }
  .frame-title{ display:flex; align-items:baseline; gap:10px; margin-bottom:6px; }
  .frame-title h2{ font-size:20px; margin:0; }
  .frame-title .path{ font-size:12.5px; color:var(--ink-soft); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
  .frame-desc{ font-size:13.5px; color:var(--ink-soft); max-width:62ch; margin-bottom:22px; }

  .browser{
    max-width:900px; background:var(--paper); border:1px solid var(--border); border-radius:12px;
    overflow:hidden; box-shadow:0 1px 0 var(--border);
  }
  .browser .chrome{
    background:var(--chrome); padding:9px 12px; display:flex; align-items:center; gap:8px;
    border-bottom:1px solid var(--border);
  }
  .chrome .dot{ width:8px; height:8px; border-radius:50%; background:var(--border); }
  .chrome .url{
    flex:1; background:var(--paper); border:1px solid var(--border); border-radius:6px;
    padding:3px 10px; font-size:11px; color:var(--ink-soft); font-family:ui-monospace,monospace;
  }
  .canvas{ padding:16px; display:flex; flex-direction:column; gap:12px; }

  /* wireframe primitives */
  .wf-block{
    background:var(--block); border:1.5px dashed var(--border); border-radius:6px;
    display:flex; align-items:center; justify-content:center; position:relative;
    color:var(--ink-soft); font-size:11.5px; padding:8px;
  }
  .wf-block.strong{ background:var(--block-strong); }
  .wf-row{ display:flex; gap:12px; }
  .wf-col{ display:flex; flex-direction:column; gap:12px; }
  .grow{ flex:1; min-width:0; }

  .wf-img{ background:
    repeating-linear-gradient(45deg, var(--block) 0 8px, var(--block-strong) 8px 16px);
    border:1.5px dashed var(--border);
  }
  .wf-btn{
    background:var(--paper); border:1.5px solid var(--ink-soft); border-radius:999px;
    padding:6px 14px; font-size:11px; color:var(--ink); align-self:flex-start; flex:none;
  }
  .wf-btn.solid{ background:var(--ink-soft); color:var(--paper); border-color:var(--ink-soft); }
  .wf-bar{ height:9px; background:var(--bar); border-radius:3px; }
  .wf-bar.w60{ width:60%; } .wf-bar.w80{ width:80%; } .wf-bar.w40{ width:40%; } .wf-bar.w30{ width:30%; } .wf-bar.w90{width:90%;}
  .wf-textblock{ display:flex; flex-direction:column; gap:7px; padding:4px 2px; }

  .header-wf{ display:flex; align-items:center; justify-content:space-between; padding:10px 14px; }
  .header-wf .brand{ display:flex; align-items:center; gap:6px; }
  .header-wf .brand .box{ width:22px; height:22px; border:1.5px solid var(--ink-soft); border-radius:4px; }
  .header-wf .brand span{ font-size:11.5px; font-weight:700; color:var(--ink); }
  .header-wf nav{ display:flex; gap:14px; font-size:11px; color:var(--ink-soft); }
  .header-wf .right{ display:flex; align-items:center; gap:8px; }
  .icon-dot{ width:16px; height:16px; border:1.5px solid var(--ink-soft); border-radius:4px; }

  .footer-wf{ display:flex; justify-content:space-between; padding:10px 14px; font-size:10.5px; color:var(--ink-soft); border-top:1.5px dashed var(--border); }

  .note{
    display:flex; gap:8px; align-items:flex-start; font-size:12px; color:var(--note);
    background:var(--note-bg); border:1px solid var(--note-border); border-radius:8px;
    padding:8px 10px; margin-top:4px;
  }
  .note b{ font-family:ui-monospace,monospace; font-size:11px; flex:none; }

  .callout{
    position:absolute; top:-9px; left:-9px; width:18px; height:18px; border-radius:50%;
    background:var(--note); color:var(--paper); font-size:10.5px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
  }
  .notes-list{ max-width:900px; margin-top:18px; display:flex; flex-direction:column; gap:8px; }

  .page{ display:none; }
  .page.active{ display:block; }

  @media (max-width:780px){
    .shell{ flex-direction:column; }
    .sidebar{ position:relative; height:auto; width:100%; border-right:none; border-bottom:1px solid var(--border); }
    main{ padding:24px 16px 60px; }
  }
</style>

<div class="shell">
  <aside class="sidebar">
    <h1>우리채 와이어프레임</h1>
    <p class="sub">설계(Designing) 단계 — 페이지별 기본 구조</p>
    <div id="tabs"></div>
  </aside>
  <main id="pages"></main>
</div>

          </div>

        </div>
        <div class="wf-row">

        <div class="wf-block" style="height:48px">다른 동 둘러보기 (카드 3개, 가로 스크롤)</div>
        <div class="wf-block footer-wf"><span>우리채</span><span>ⓒ 2026</span></div>
      `
    },
    {
      id: 'guide', name: '이용안내', path: '/guide',
      desc: '홈의 요약 카드와 달리, 여기는 전문(全文)을 다룹니다.',
      notes: [
        ['①', 'FAQ는 아코디언으로 접어 스캔 부담을 줄임'],
        ['②', '페이지 맨 끝에도 예약 CTA — 규정을 다 읽고 안심한 사용자를 놓치지 않음']
      ],
      body: `
        <div class="wf-block header-wf">
          <div class="brand"><div class="box"></div><span>우리채</span></div>
          <nav><span>공간</span><span>하루</span><span>이용안내</span></nav>
          <div class="right"><div class="icon-dot"></div><div class="icon-dot"></div><div class="wf-btn solid">날짜 볼까요?</div></div>
        </div>
        <div class="wf-bar w30" style="height:18px; margin-top:8px"></div>
        <div class="wf-row">
          ${['체크인/아웃','인원','반려동물','바베큐','수영장','주차'].map(()=>`<div class="wf-block grow" style="height:64px"></div>`).join('')}
        </div>
        <div class="wf-block" style="height:110px; position:relative"><span class="callout">①</span>자주 묻는 질문 (아코디언 목록)</div>
        <div class="wf-block strong" style="height:56px; position:relative"><span class="callout">②</span>예약 전 마지막 확인 CTA</div>

            <div class="wf-btn">주소 복사</div>
            <div class="wf-bar w80"></div>
            <div class="wf-bar w60"></div>
          </div>
        </div>
        <div class="wf-row" style="height:70px">

    {

      ],
      body: `

        <div class="wf-block strong" style="height:44px; margin-top:6px; position:relative"><span class="callout">①</span>동 선택 탭: 소나무동 · 별채동 · 마당동 · 노을동</div>

          <div class="wf-col grow"><div class="wf-bar w60"></div><div class="wf-bar w40"></div></div>
        </div>
        <div class="wf-block strong" style="height:56px; position:relative"><span class="callout">②</span>[예약 문의하기] — 우리끼리 쓸 날짜, 잡아볼까요?</div>
        <div class="wf-block footer-wf"><span>우리채</span><span>ⓒ 2026</span></div>
      `
    }
  ];

  const tabsEl = document.getElementById('tabs');
  const pagesEl = document.getElementById('pages');

  pages.forEach((p, i) => {
    const btn = document.createElement('button');
    btn.className = 'tab' + (i === 0 ? ' active' : '');
    btn.dataset.id = p.id;
    btn.innerHTML = `<span class="name">${p.name}</span><span class="path">${p.path}</span>`;
    btn.addEventListener('click', () => show(p.id));
    tabsEl.appendChild(btn);

    const section = document.createElement('section');
    section.className = 'page' + (i === 0 ? ' active' : '');
    section.id = 'page-' + p.id;
    section.innerHTML = `
      <div class="frame-title"><h2>${p.name}</h2><span class="path">${p.path}</span></div>
      <p class="frame-desc">${p.desc}</p>
      <div class="browser">
        <div class="chrome"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="url">woorichae.com${p.path.startsWith('/') ? p.path : ''}</div></div>
        <div class="canvas">${p.body}</div>
      </div>
      <div class="notes-list">
        ${p.notes.map(n => `<div class="note"><b>${n[0]}</b><span>${n[1]}</span></div>`).join('')}
      </div>
    `;
    pagesEl.appendChild(section);
  });

  function show(id) {
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.id === id));
    document.querySelectorAll('.page').forEach(s => s.classList.toggle('active', s.id === 'page-' + id));
  }
</script>
